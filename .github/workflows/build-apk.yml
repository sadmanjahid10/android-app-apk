name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d. -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Unable to determine Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or higher is required. Found Java $JAVA_MAJOR"
            exit 1
          fi
          echo "Java $JAVA_MAJOR verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Prepare Debug Keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore using Java 17 keytool..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create debug.keystore"
              exit 1
            fi
            echo "Debug keystore created successfully."
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Primary debug APK not found in expected location. Searching app/build/outputs/apk..."
            find app/build/outputs/apk -name "*.apk"
            echo "Error: $APK_PATH does not exist."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null || wc -c < "$APK_PATH")
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)

          APP_ID=""
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            LATEST_BUILD_TOOLS=$(ls -1d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
            if [ -x "$LATEST_BUILD_TOOLS/aapt" ]; then
              APP_ID=$("$LATEST_BUILD_TOOLS/aapt" dump badging "$APK_PATH" 2>/dev/null | awk -F"'" '/package: name=/ {print $2}')
            elif [ -x "$LATEST_BUILD_TOOLS/aapt2" ]; then
              APP_ID=$("$LATEST_BUILD_TOOLS/aapt2" dump badging "$APK_PATH" 2>/dev/null | awk -F"'" '/package: name=/ {print $2}')
            fi
          fi

          if [ -z "$APP_ID" ] && command -v apkanalyzer >/dev/null 2>&1; then
            APP_ID=$(apkanalyzer manifest application-id "$APK_PATH" 2>/dev/null || apkanalyzer -h manifest application-id "$APK_PATH" 2>/dev/null)
          fi

          if [ -z "$APP_ID" ] && [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            APP_ID=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK_PATH" 2>/dev/null)
          fi

          if [ -z "$APP_ID" ]; then
            APP_ID="unknown.package"
          fi

          echo "================ APK VERIFICATION ================"
          echo "Generated APK:"
          echo "$APK_PATH"
          echo ""
          echo "Application ID:"
          echo "$APP_ID"
          echo ""
          echo "SHA-256:"
          echo "$APK_SHA256"
          echo ""
          echo "APK size: $APK_SIZE bytes"
          echo "==================================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7